[project]
name = "xcpc-claw"
version = "0.1.0"
description = "AI-Native XCPC Stress-Testing, Hacking & Personalized Coaching Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.scripts]
xcpc-claw = "main:main"

[tool.uv]
# 本项目是一个"脚本式"工程（入口为 main.py），不以 wheel 形式分发，
# 因此无需 build-system，`uv sync` 只负责创建 .venv 并安装 4 个核心依赖。
package = false
